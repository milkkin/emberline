# Render blueprint: one free web service running the Emberline server.
# After the first deploy, add TELEGRAM_BOT_TOKEN and TELEGRAM_WEBHOOK_SECRET under the
# service's Environment tab (never commit them to the repository). The server then connects
# the bot to itself on every start.
services:
  - type: web
    name: emberline
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
